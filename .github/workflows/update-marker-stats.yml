name: Update marker statistics

on:
  schedule:
    # Monday 09:17 Asia/Seoul (00:17 UTC); avoid the busy start of the hour.
    - cron: '17 0 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-marker-stats.yml'
      - 'scripts/marker_stats.py'
      - 'scripts/test_marker_stats.py'
      - 'scripts/requirements-stats.txt'

permissions:
  contents: read

concurrency:
  group: marker-statistics
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'Alfex4936/k-pullup'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements-stats.txt
      - name: Install chart dependency
        run: python -m pip install -r scripts/requirements-stats.txt
      - name: Test aggregation and failure handling
        run: python -m unittest discover -s scripts -p 'test_marker_stats.py' -v
      - name: Fetch public data and generate chart
        run: python scripts/marker_stats.py
      - name: Commit generated statistics only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/statistics/coverage.svg docs/statistics/coverage.png docs/statistics/summary.json
          if git diff --cached --quiet; then
            echo 'Statistics are unchanged.'
            exit 0
          fi
          git commit -m 'docs: refresh marker statistics'
          git pull --rebase origin main
          git push origin HEAD:main
